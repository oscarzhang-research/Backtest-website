name: Probe leveraged-sim underlyings (temporary)

on:
  push:
    branches: [claude/great-johnson-rp3hbj]
    paths: [scripts/probe-underlying.js, .github/workflows/probe-underlying.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-underlying.js "$GITHUB_STEP_SUMMARY"
