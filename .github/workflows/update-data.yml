name: Update market data

# After every US market close: download the day's session (Yahoo Finance; T-bill rate and 10-year yield from the U.S.
# Treasury; CPI from the BLS), append it to data/market-data.js, run all tests on the result, commit to main and
# redeploy the site. A second run before the next open catches up anything the evening run missed. Nothing is
# committed if a download or a check fails; the site then keeps the previous data.
# Intraday prices are never committed: the Pages deployment (pages.yml) adds them to the deployed copy only.
# "Run workflow" does the same on demand (tick "check only" to download and verify without committing).
# Pull requests that change the updater run it as a check only, in both modes.
on:
  schedule:
    - cron: '17 23 * * 1-5'   # Mon–Fri 23:17 UTC = 19:17 EDT / 18:17 EST: a session counts once it is 18:00 in New York
    - cron: '17 11 * * 2-6'   # Tue–Sat 11:17 UTC = 07:17 EDT / 06:17 EST: catch-up before the next open
  workflow_dispatch:
    inputs:
      check_only:
        description: Download and verify, but do not commit
        type: boolean
        default: false
  pull_request:
    paths:
      - scripts/update-data.js
      - scripts/data/**
      - .github/workflows/update-data.yml
      - .github/workflows/pages.yml

permissions:
  contents: write   # commit the updated data
  actions: write    # start the Pages deployment (pushes made with this token do not trigger workflows)

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Download new sessions and update data/market-data.js
        run: node scripts/update-data.js --summary "$GITHUB_STEP_SUMMARY" --commit-message "$RUNNER_TEMP/commit-message.txt"

      - name: Intraday mode, as the Pages deployment runs it (check only)
        if: github.event_name == 'pull_request'
        run: node scripts/update-data.js --live --out "$RUNNER_TEMP/live-data.js" --summary "$GITHUB_STEP_SUMMARY"

      - name: Unit tests on the updated data
        run: npm test

      - name: Browser smoke test on the updated data
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Commit and redeploy the site
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.check_only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/market-data.js; then echo "No new data."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-data.js
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_NAME" = "main" ]; then gh workflow run pages.yml --ref main; fi
