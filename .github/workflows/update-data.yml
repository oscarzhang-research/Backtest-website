name: Update market data

# After every US market close: download the day's session (Yahoo Finance; T-bill rate and 10-year yield from the U.S.
# Treasury; CPI from the BLS), append it to data/market-data.js, run all tests on the result, commit to main and
# redeploy the site. A second run before the next open catches up anything the evening run missed. Nothing is
# committed if a download or a check fails; the site then keeps the previous data.
# Intraday prices are never committed: the Pages deployment (pages.yml) adds them to the deployed copy only.
# "Run workflow" does the same on demand (tick "check only" to download and verify without committing).
# Pull requests that change the updater run it as a check only, in both modes.
on:
  schedule:
    - cron: '17 23 * * 1-5'   # Mon–Fri 23:17 UTC = 19:17 EDT / 18:17 EST: a session counts once it is 18:00 in New York
    - cron: '17 11 * * 2-6'   # Tue–Sat 11:17 UTC = 07:17 EDT / 06:17 EST: catch-up before the next open
  workflow_dispatch:
    inputs:
      check_only:
        description: Download and verify, but do not commit
        type: boolean
        default: false
  pull_request:
    paths:
      - scripts/update-data.js
      - scripts/update-regime.js
      - scripts/data/**
      - scripts/regime/**
      - .github/workflows/update-data.yml
      - .github/workflows/pages.yml

permissions:
  contents: write   # commit the updated data
  actions: write    # start the Pages deployment (pushes made with this token do not trigger workflows)
  issues: write     # open an alert issue while scheduled updates fail, close it when one succeeds

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    # Pinned for the browser smoke test: Playwright 1.56.1 cannot install Chromium's dependencies on Ubuntu 26.04
    # (ubuntu-latest since 2026-11). Back to ubuntu-latest once Playwright is upgraded to a release that supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # each step keeps its output in $RUNNER_TEMP/<id>.log, for the alert issue below
      - name: Download new sessions and update data/market-data.js
        id: download
        run: |
          set -o pipefail
          node scripts/update-data.js --summary "$GITHUB_STEP_SUMMARY" --commit-message "$RUNNER_TEMP/commit-message.txt" 2>&1 | tee "$RUNNER_TEMP/download.log"

      - name: Intraday mode, as the Pages deployment runs it (check only)
        if: github.event_name == 'pull_request'
        run: node scripts/update-data.js --live --out "$RUNNER_TEMP/live-data.js" --summary "$GITHUB_STEP_SUMMARY"

      # The bull/bear dashboard's series (data/regime-data.js): best effort, so a source that is down never holds up the
      # market data; every source that fails keeps its stored series.
      - name: Update the bull/bear dashboard data (best effort)
        id: regime
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/update-regime.js --summary "$GITHUB_STEP_SUMMARY" 2>&1 | tee "$RUNNER_TEMP/regime.log"

      # Only for the live site: compare the dashboard's state (alerts, templates, leverage gears) with the last update's
      # (data/regime-state.json, committed with the data); a change opens an issue below, which e-mails the owner.
      - name: Bull/bear dashboard state
        id: regimestate
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/regime-alert.js --out "$RUNNER_TEMP/regime-alert.md" --outputs "$GITHUB_OUTPUT"

      - name: Unit tests on the updated data
        id: unit
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/unit.log"

      - name: Browser smoke test on the updated data
        id: smoke
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          npm run test:e2e 2>&1 | tee -a "$RUNNER_TEMP/smoke.log"

      - name: Commit and redeploy the site
        id: commit
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.check_only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee "$RUNNER_TEMP/commit.log") 2>&1
          if git diff --quiet -- data/market-data.js data/regime-data.js data/regime-state.json && [ -z "$(git ls-files --others --exclude-standard data/regime-data.js data/regime-state.json)" ]; then echo "No new data."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-data.js; for f in data/regime-data.js data/regime-state.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          [ -s "$RUNNER_TEMP/commit-message.txt" ] || printf 'Update the bull/bear dashboard data\n\nNo new market sessions; the regime series (data/regime-data.js) changed.\n' > "$RUNNER_TEMP/commit-message.txt"
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_NAME" = "main" ]; then gh workflow run pages.yml --ref main; fi

      - name: Report a change in the bull/bear dashboard's state
        if: steps.regimestate.outputs.changed == 'true' && steps.commit.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh label create regime-alert --color FBCA04 --description "The bull/bear dashboard's state changed" 2>/dev/null || true
          printf '\n@%s\n' "$OWNER" >> "$RUNNER_TEMP/regime-alert.md"
          url=$(gh issue create --title "牛熊仪表盘状态变化 / Bull/bear dashboard changed ($(date -u +%F))" --label regime-alert --body-file "$RUNNER_TEMP/regime-alert.md")
          echo "Opened $url"
          # one open report at a time: the new one supersedes the older ones
          for n in $(gh issue list --label regime-alert --state open --json number --jq '.[].number'); do
            if [ "$n" != "${url##*/}" ]; then gh issue close "$n" --comment "Superseded by $url" || true; fi
          done

      # The preview at /beta/ (pages.yml) is published from its own branch. Keep that branch's data current: the market
      # data just committed here and, when the branch has the bull/bear updater, its series rebuilt on them; then
      # redeploy. Best effort: the branch's own unit tests must pass, and nothing here touches main or the site.
      - name: Bring the preview branch's data up to date (best effort)
        id: preview
        if: steps.commit.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_REF: claude/great-johnson-rp3hbj
        run: |
          set -e
          if ! git fetch --no-tags --depth 1 origin "$BETA_REF"; then echo "No preview branch."; exit 0; fi
          wt="$RUNNER_TEMP/preview"
          git worktree add --detach "$wt" FETCH_HEAD
          cp data/market-data.js "$wt/data/market-data.js"
          cd "$wt"
          if [ -f scripts/update-regime.js ]; then node scripts/update-regime.js --summary "$GITHUB_STEP_SUMMARY" || echo "::warning::The preview's bull/bear data were not rebuilt."; fi
          npm test > "$RUNNER_TEMP/preview-tests.log" 2>&1 || { tail -n 40 "$RUNNER_TEMP/preview-tests.log"; echo "::warning::The preview's tests fail on the new data; its branch is left as it is."; exit 0; }
          if git diff --quiet -- data; then echo "The preview's data are current."; exit 0; fi
          git add data
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Update the preview's data from main ($(date -u +%F))"
          git push origin "HEAD:refs/heads/$BETA_REF"
          echo "Preview branch $BETA_REF updated." | tee -a "$GITHUB_STEP_SUMMARY"
          gh workflow run pages.yml --ref main

      # Alerts: one issue stays open (and e-mails the owner) while scheduled or manual updates fail; the next
      # successful update closes it. Pull-request check runs never alert.
      - name: Open or update the alert issue
        if: failure() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
          FAILED: ${{ steps.download.outcome == 'failure' && 'download' || steps.unit.outcome == 'failure' && 'unit' || steps.smoke.outcome == 'failure' && 'smoke' || steps.commit.outcome == 'failure' && 'commit' || 'setup' }}
        run: bash scripts/update-alert.sh fail

      - name: Close the alert issue
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/update-alert.sh ok
