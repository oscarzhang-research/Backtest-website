name: Probe data sources (temporary)

# Which candidate sources for the bull/bear dashboard answer from a GitHub-hosted runner. Read-only; removed before merge.
on:
  push:
    branches: ['claude/**']
    paths: [scripts/regime/probe.js, .github/workflows/probe-sources.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/regime/probe.js
