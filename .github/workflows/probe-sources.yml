name: Probe data sources (temporary)
on:
  push:
    branches: [claude/great-johnson-rp3hbj]
    paths: [.github/workflows/probe-sources.yml, scripts/probe-sources.mjs]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node fetch
        continue-on-error: true
        run: node scripts/probe-sources.mjs
      - name: curl to FRED and Treasury
        continue-on-error: true
        run: |
          for u in "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DTB3&cosd=2026-09-01" "https://home.treasury.gov/"; do
            curl -sS -o /tmp/out -w "== %{http_code} connect %{time_connect}s total %{time_total}s  $u\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" --max-time 60 "$u" || echo "curl failed: $u"; head -c 200 /tmp/out 2>/dev/null; echo; done
