name: Rebuild leveraged ETF history (one-off)

# Runs scripts/rebuild-leveraged.js on a GitHub runner (Yahoo Finance is reachable from there) and commits the
# rebuilt data/market-data.js to this branch. Triggered by changes to the script on the working branch only.
on:
  push:
    branches: [claude/great-johnson-rp3hbj]
    paths: [scripts/rebuild-leveraged.js, .github/workflows/rebuild-leveraged.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-leveraged
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild SOXL, TQQQ and their simulated histories
        run: node scripts/rebuild-leveraged.js --write --summary "$GITHUB_STEP_SUMMARY"
      - name: Commit the rebuilt data
        run: |
          if git diff --quiet -- data/market-data.js; then echo "Nothing changed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-data.js
          git commit -m "Rebuild SOXL and TQQQ from full-precision prices with distributions; refit SOXL*, add TQQQ*" -m "Generated by scripts/rebuild-leveraged.js on a GitHub runner."
          git push origin "HEAD:${GITHUB_REF_NAME}"
